name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Ruff check
        run: cd backend && ruff check .

      - name: Ruff format check
        run: cd backend && ruff format --check .

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests
        run: cd frontend && npm test

      - name: TypeScript type check
        run: cd frontend && npx tsc -b

      - name: ESLint
        run: cd frontend && npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Start test stack (postgres + redis)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run unit tests
        run: cd backend && python -m pytest tests/unit/ -v
        env:
          DESCOPE_PROJECT_ID: "test-project-id"
          TEST_DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          TEST_REDIS_URL: redis://localhost:16379/0

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Start test stack (postgres + redis)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests
        if: env.DESCOPE_PROJECT_ID != ''
        run: cd backend && python -m pytest tests/integration/ -v
        env:
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          DESCOPE_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}
          DESCOPE_EXPIRED_TOKEN: ${{ secrets.DESCOPE_EXPIRED_TOKEN }}
          TEST_DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          TEST_REDIS_URL: redis://localhost:16379/0

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install pytest-playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}

      - name: Start test stack (postgres + redis)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Apply database schema
        run: cd backend && python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test

      # The backend must run against a schema-bearing database. It previously ran
      # on sqlite :memory:, which passes the startup connectivity check but has no
      # tables, so every canonical-repository route raised "no such table".
      # Redirected to a file, not left on the step's stdout. The backend outlives
      # the step that starts it, so everything it logs during the test run —
      # including the upstream Descope status and body behind every 400/502 the
      # API passes through — was written to an already-closed step log and lost.
      # That is what made this failure class undiagnosable from CI alone.
      - name: Start backend
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          sleep 3
        env:
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
          DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          REDIS_URL: redis://localhost:16379/0
          # The rate-limit key is the authenticated `sub`, and the whole E2E suite
          # shares one access-key identity — so the default 10/minute write budget
          # is consumed by the first few tests and the rest 429. That is an artifact
          # of the harness, not of real usage. Limiter behavior is covered by the 18
          # tests in tests/unit/test_rate_limiting.py.
          RATE_LIMIT_DEFAULT: 2000/minute
          RATE_LIMIT_AUTH: 1000/minute

      - name: Start frontend (preview)
        run: |
          cd frontend
          npx vite preview --port 3000 &
          sleep 2

      - name: Run E2E tests
        if: env.DESCOPE_PROJECT_ID != ''
        run: cd backend && python -m pytest tests/e2e/ -v
        env:
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
          DESCOPE_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          DESCOPE_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_TENANT_ID: ${{ secrets.E2E_TEST_TENANT_ID }}
          E2E_FRONTEND_URL: "http://localhost:3000"
          E2E_BACKEND_URL: "http://localhost:8000"

      # This repository is public, so its artifacts are world-readable. The
      # backend is not supposed to log credentials, but an unhandled traceback
      # can carry one it was handed, so the log is scrubbed before it ever leaves
      # the runner rather than trusted to be clean: JWT-shaped triples and any
      # Bearer value are redacted. Never weaken this to upload the raw log.
      - name: Redact credentials from the backend log
        id: redact
        if: always()
        run: |
          f="$RUNNER_TEMP/backend.log"
          [ -f "$f" ] || exit 0
          sed -i -E \
            -e 's/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
            -e 's/([Bb]earer )[A-Za-z0-9._~+:\/-]+=*/\1<redacted>/g' \
            -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^:/@ ]+:[^@ ]+@#\1<redacted>:<redacted>@#g' \
            -e 's/(K[A-Za-z0-9]{25,})/<redacted-key>/g' \
            "$f"

      # Always, not only on failure: a suite that passes while the backend logs
      # upstream errors is exactly the state this repo spent months in.
      # NOT plain always(): publishing is conditional on the redaction above
      # having succeeded. If sed fails the log must not leave the runner —
      # this repository is public and artifacts are world-readable.
      - name: Upload backend log
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker images
        run: docker compose build
        env:
          DESCOPE_PROJECT_ID: "test-project-id"
          POSTGRES_PASSWORD: "ci-build-only"
          TYK_GATEWAY_SECRET: "ci-build-only"

  profile-integration-tests:
    name: Profile Integration Tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-integration
      DESCOPE_PROJECT_ID: ci-test-project
      DESCOPE_MANAGEMENT_KEY: ci-integration-mgmt-key
      TYK_GATEWAY_SECRET: ci-integration-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run standalone profile integration tests
        run: make test-integration-standalone

      - name: Run gateway profile integration tests
        run: make test-integration-gateway
