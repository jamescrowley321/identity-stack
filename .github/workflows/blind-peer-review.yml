# Blind Peer Review — fresh-context, diff-only AI PR review. ON DEMAND ONLY.
# https://github.com/jamescrowley321/blind-peer-review
#
# This does NOT run automatically on pull requests, and "Merge Gate" is NOT a
# required check. Routine review happens locally, before the push, running the
# same lens library as isolated Claude Code subagents:
#
#     /plugin marketplace add jamescrowley321/blind-peer-review
#     /plugin install blind-peer-review
#     /blind-peer-review:check     # reviews the working diff against origin/main
#
# This workflow stays for the times a cloud second opinion is wanted on an open
# PR: run it from the Actions tab with the PR number.
#
# Why it is not automatic: the action posts a GitHub review per lens on every
# run, and a lens with zero findings still posts one — it anchors a synthetic
# "See the review summary." inline comment on the first changed line. There is
# no input that suppresses posting, so six lenses times every push put review
# comments on every PR regardless of whether anything was found. Nothing gated
# on them: "Merge Gate" was never added to branch protection in this repo.
#
# Setup: repo secret OPENROUTER_API_KEY. Toggle lenses in the ENABLED list in the
# `config` job — that one list drives BOTH the review matrix AND the gate.
#
# NOTE: the dispatch path itself is fixed by blind-peer-review#85 and needs the
# release that carries it. At this pin, every step that anchors to the commit
# under review reads `context.payload.pull_request.head.sha`, which is undefined
# on a workflow_dispatch — preflight throws a TypeError, the lenses skip, and the
# gate fails closed. Bump the pin once that lands. Local review via the plugin
# above is unaffected and is the routine path either way.

name: Blind Peer Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the open PR to review'
        required: true
        type: string

# Keyed on the PR, not github.ref: a dispatch always runs on a branch ref (main,
# normally), so keying on the ref would make two reviews of two different PRs
# cancel each other.
concurrency:
  # The `|| github.ref` fallback is not reachable today (dispatch is the only
  # trigger, and pr_number is required). It is there so that re-adding any other
  # trigger cannot silently collapse every run into one group named
  # `blind-peer-review-` and have each new PR cancel the previous PR's review.
  group: blind-peer-review-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true
# Least privilege by default: only the `review` job (the lens reviewer that
# posts inline comments + per-lens check runs) is granted write, scoped on the
# job below. config/preflight/gate keep narrower read-only scopes.
permissions:
  contents: read

jobs:
  # The ONE place to toggle lenses. Emits the enabled set as a matrix, which is
  # what BOTH the review jobs and the gate consume — v3.0.0 takes the matrix
  # object itself as the gate's `lenses` input, so there is no second delimited
  # copy to drift.
  config:
    runs-on: ubuntu-latest
    permissions: {} # computes the lens matrix only — no API access needed
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: node {0}
        env:
          # v3.0.0 renamed every lens key. The old names (blind, edge-case,
          # sentinel, viper, compliance, owasp-web) are rejected by the action's
          # registry, so these must move together with the pin.
          ENABLED: |
            cold_read  # logic bugs, footguns (zero context)
            edge_case  # unhandled branches / boundaries
            acceptance # PR acceptance criteria met + tested
            security   # exploitable security vulnerabilities
            red_team   # red-team attack paths (auth/infra)
            policy     # AI-provenance policy + repo rules
            owasp_web  # OWASP Web Top 10 — this is a web app + API
            # owasp_llm  # OWASP GenAI/LLM Top 10 — enable if/when LLM features land
        run: |
          const NAMES = {
            cold_read: "Cold Read", edge_case: "Edge Cases",
            acceptance: "Acceptance Criteria", security: "Security Review",
            red_team: "Red Team", policy: "Policy & Provenance",
            owasp_web: "OWASP Web Top 10", owasp_llm: "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) {
            // `shell: node {0}` runs plain Node — there is no actions/github-script
            // `core` object here, so fail via process.exit, not `core.setFailed`.
            console.error("ENABLED must list at least one lens; an empty matrix would fail workflow validation with an opaque error.");
            process.exit(1);
          }
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);

  # Don't spend the paid lenses until the cheap deterministic gates pass.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No owner/fork guard is needed any more: workflow_dispatch requires write
    # access on this repo, so a fork, an outside contributor or a bot cannot
    # start this workflow at all. The old guard read
    # github.event.pull_request.author_association, which is empty on a dispatch
    # — it would evaluate false and skip every lens.
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          # EXACT check-run names (job `name:` values) that must pass first.
          #
          # One per line. v3.0.0 stopped splitting this input on commas, because
          # a check name may legally contain one — and this repo has two that do
          # ("Semgrep (SAST)" does not, but the comma form would still have made
          # `Lint, Unit Tests, Semgrep (SAST), Gitleaks (Secret Scanning)` a
          # SINGLE check name that never reports, so preflight could only end in
          # its timeout and the gate then fails closed).
          #
          # E2E Tests is deliberately excluded: it is a required check for merge,
          # but it runs for minutes against live Descope and is not what "is this
          # PR worth spending review compute on" should wait for.
          required_checks: |
            Lint
            Unit Tests
            Semgrep (SAST)
            Gitleaks (Secret Scanning)

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # The only job that needs write: it posts inline review comments. Scoped
    # here rather than granted workflow-wide. No checks:write — the action's
    # only Checks API call is checks.listForRef (read), in preflight.
    permissions:
      contents: read
      pull-requests: write
      issues: read # the Policy & Provenance lens reads the PR thread
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # anthropic/claude-sonnet-5 is unusable via openrouter+pi: OpenRouter
          # retired the undated alias (404) while pi's catalog lacks the dated
          # snapshot, so every lens on every recent run failed with
          # `404 <!DOCTYPE html>`. google/gemini-2.5-pro is the v3.0.0 default and
          # what identity-model runs. No models_config: the account-level routing
          # is the proven-green path, and pinning a zdr filter per request can
          # leave the model with no eligible endpoint.
          model: google/gemini-2.5-pro

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run, so a dispatch whose lenses were skipped or crashed reports an
    # explicit failure rather than quietly vanishing from the run summary.
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      # review is 'skipped' if preflight failed and 'failure' if a lens leg
      # crashed. Either way, don't adjudicate a partial/absent lens set.
      - name: Fail closed when review did not complete
        if: needs.review.result != 'success'
        run: |
          echo "::error::Blind peer review did not complete (review=${{ needs.review.result }}): preflight failed, or one or more lenses crashed. Nothing was adjudicated — re-run the dispatch, or review locally with /blind-peer-review:check."
          exit 1
      - name: Adjudicate lenses
        if: needs.review.result == 'success'
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.matrix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
