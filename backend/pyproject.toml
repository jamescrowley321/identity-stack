[project]
name = "identity-stack-backend"
version = "0.1.0"
description = "FastAPI backend for Identity Stack"
requires-python = ">=3.12"
dependencies = [
    # Capped <0.137: FastAPI 0.137 changed include_router to append a lazy
    # `_IncludedRouter` proxy to app.routes instead of flattening child routes.
    # slowapi 0.1.10's SlowAPIMiddleware route matcher only recognizes top-level
    # routes with an `.endpoint`, so router-included routes become "unmatched" and
    # SlowAPIMiddleware silently exempts them — disabling default rate limits.
    # Revisit when slowapi ships a fix for the new inclusion model.
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.34.0,<1",
    # 5.0 takes the provider's issuer for discovery and requires the document's
    # issuer to equal it exactly, raises MalformedTokenException for a token
    # that is not a compact JWS, and carries TokenValidationConfig.token_issuers,
    # which Descope's three issuer forms need. It refuses HMAC algorithms and
    # weak keys by default and requires cryptography>=50
    # (PYSEC-2026-3552/3553/3554).
    "py-identity-model>=5.0.0,<6",
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.14",
    "expression>=5.0",
    "httpx>=0.28,<1",
    "pydantic[email]>=2.12.5",
    "slowapi>=0.1.9,<1",
    "python-json-logger>=4.1.0,<5",
    "scalar-fastapi>=1.8.2",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.62b0",
    "opentelemetry-instrumentation-logging>=0.62b0",
    "redis[hiredis]>=7.4.0,<9",
    # Seals the registration tokens of Keycloak machine clients at rest (#698).
    "cryptography>=50",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "anyio[trio]>=4.13.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# TID251 enforces the house rules in docs/conventions.md; G004/G010 keep log calls lazy.
select = ["E", "F", "I", "W", "S", "TID251", "G004", "G010"]

# docs/conventions.md §1, §4 and §7. Each helper module is the one exception to
# its own ban and is listed under per-file-ignores below.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through app.knobs (docs/conventions.md §1)."
"os.getenv".msg = "Read configuration through app.knobs (docs/conventions.md §1)."
"httpx".msg = "Build clients with app.outbound.outbound_client and catch its Upstream* errors (docs/conventions.md §4)."
"logging.getLogger".msg = "Get a logger with app.logbook.logbook(__name__) (docs/conventions.md §7)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "TID251"]  # assert, hardcoded passwords OK in tests; house bans cover app/ only
"tests/unit/test_provider_terraform_roots.py" = ["S603"]  # runs the CI step's jq filter and the make target under test
"tests/unit/repositories/test_machine_credential_registration_tokens.py" = ["S603"]  # runs the alembic CLI across the revision under test
"tests/integration/test_tenant_resource_id_space_migration.py" = ["S603"]  # runs alembic, as the conftest does, to move the schema down and up
"app/knobs.py" = ["TID251"]  # the settings module: the one reader of os.environ
"app/outbound.py" = ["TID251"]  # the HTTP client helper: the one importer of httpx
"app/logbook.py" = ["TID251"]  # the logging helper: the one caller of logging.getLogger
"scripts/**" = ["TID251"]  # operator scripts run outside the app process
"migrations/**" = ["TID251"]  # Alembic env.py runs under the alembic CLI and reads DATABASE_URL itself

# docs/conventions.md §22-§27 and ADR-0008. Run by `make lint` as `lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true
contract_types = ["context_layers: import_contracts.ContextLayersContract"]

[[tool.importlinter.contracts]]
name = "Layers import inward (conventions §22)"
type = "layers"
layers = [
    "app.routers",
    "app.dependencies",
    "app.services",
    "app.repositories",
    "app.models",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "The domain imports no framework and no other layer (conventions §23)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.*",
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "logging",
    "opentelemetry",
    "pydantic",
    "py_identity_model",
    "redis",
    "slowapi",
    "sqlalchemy",
    "sqlmodel",
    "starlette",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts do not import each other (conventions §27)"
type = "independence"
modules = ["app.domain.*"]

# Routers reach data and providers only through a service; services hold domain
# values, not table rows (§26). `unmigrated` has one entry per bounded
# context that has not moved onto the domain yet. A migration deletes its entry;
# the contract fails on an entry that no longer excuses anything.
[[tool.importlinter.contracts]]
name = "Routers and services skip no layer (conventions §26)"
type = "context_layers"
rules = [
    "app.routers -> app.repositories",
    "app.routers -> app.models",
    "app.routers -> app.outbound",
    "app.services -> app.models",
]
unmigrated = [
    "Directory (#515): app.routers.canonical_users app.routers.tenants app.services.tenant app.services.user",
    "Federation (#516): app.routers.providers app.services.identity_provisioning app.services.idp_link app.services.provider",
    "Documents and FGA (#517): app.routers.documents",
    "Synchronisation (#518): app.routers.sync_status app.services.inbound_sync app.services.keycloak_reconciliation app.services.reconciliation app.services.sync_status",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "anyio: mark test to run with anyio",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest-playwright>=0.7.2",
    "pytest>=9.0.3",
    "anyio[trio]>=4.13.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.0",
    "import-linter>=2.16",
]
