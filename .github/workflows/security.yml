name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # Daily 6am UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Suppressed pip-audit findings, space-separated vuln IDs (CVE, PYSEC or
      # GHSA). The project rule is that CVEs are fixed, not ignored: an entry
      # here is a dated exception that must be justified, not an allowlist.
      # Keep this list identical to PIP_AUDIT_IGNORES in the Makefile; the job
      # fails if the two drift.
      #
      # Document each entry in a comment block here, in this form:
      #   <ID> - <package> <version> - why it can't be fixed or isn't
      #   reachable - assessed <YYYY-MM-DD> - remove when <condition>
      #
      # Currently none. Removed 2026-10-28 after re-assessment:
      #   CVE-2026-4539 - pygments ReDoS in the AdlLexer, fixed in 2.20.0;
      #     uv.lock resolves pygments 2.21.0 (dev-only, via pytest and rich).
      #   CVE-2026-3219 - pip accepted concatenated ZIP/tar archives, fixed in
      #     26.1; this job installs pip>=26.1 and uv.lock pins pip 26.2.1.
      PIP_AUDIT_IGNORES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade "pip>=26.1"
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Check suppressions match the Makefile
        run: |
          # Unset the job's copy so make can only report the Makefile's own value.
          make_ignores=$(env -u PIP_AUDIT_IGNORES make --no-print-directory --eval='print-pip-audit-ignores: ; @echo $(PIP_AUDIT_IGNORES)' print-pip-audit-ignores)
          normalize() { tr -s ' ' '\n' <<<"$1" | sed '/^$/d' | sort; }
          if [ "$(normalize "$make_ignores")" != "$(normalize "$PIP_AUDIT_IGNORES")" ]; then
            echo "::error::PIP_AUDIT_IGNORES differs: security.yml='${PIP_AUDIT_IGNORES}' Makefile='${make_ignores}'"
            exit 1
          fi

      # pip-audit runs without any --ignore-vuln flags so suppressed findings
      # are still seen; the suppression is applied below, and every suppressed
      # finding is listed in the job summary. On the daily scheduled run a
      # suppression fails the job once a fixed version exists or once the
      # finding is gone, so a stale entry can't sit here unnoticed.
      - name: Run pip-audit
        run: |
          # The report goes outside the checkout so a committed file can't stand in for it.
          report="$RUNNER_TEMP/pip-audit.json"
          rm -f "$report"
          set +e
          pip-audit --desc --format json --output "$report"
          status=$?
          set -e
          if [ ! -s "$report" ]; then
            echo "::error::pip-audit exited $status without writing a report"
            exit 1
          fi
          # -I keeps the checkout off sys.path, so a committed json.py can't
          # shadow the standard library here.
          PIP_AUDIT_REPORT="$report" PIP_AUDIT_STATUS="$status" python -I - <<'EOF'
          import json
          import os
          import sys

          # IDs are compared case-insensitively, so cve-/CVE- spellings both match.
          def upper(ids):
              return {i.upper() for i in ids}

          ignores = upper(os.environ["PIP_AUDIT_IGNORES"].split())
          scheduled = os.environ["GITHUB_EVENT_NAME"] == "schedule"
          with open(os.environ["PIP_AUDIT_REPORT"]) as f:
              report = json.load(f)

          # The same vulnerability can come back once per database (PYSEC and
          # GHSA) with differing alias lists, so records for a package that
          # share any ID are merged into one finding.
          findings = []
          for dep in report["dependencies"]:
              merged = []
              for vuln in dep.get("vulns", []):
                  finding = {
                      "name": dep["name"],
                      "version": dep["version"],
                      "ids": {vuln["id"], *vuln.get("aliases", [])},
                      "fixes": set(vuln.get("fix_versions", [])),
                      "desc": " ".join((vuln.get("description") or "").split()),
                  }
                  for other in [m for m in merged if upper(m["ids"]) & upper(finding["ids"])]:
                      merged.remove(other)
                      finding["ids"] |= other["ids"]
                      finding["fixes"] |= other["fixes"]
                      finding["desc"] = finding["desc"] or other["desc"]
                  merged.append(finding)
              findings += merged
          for finding in findings:
              finding["hit"] = sorted(i for i in finding["ids"] if i.upper() in ignores)

          matched = {i.upper() for f in findings for i in f["hit"]}
          unsuppressed = [f for f in findings if not f["hit"]]
          fixable = [f for f in findings if f["hit"] and f["fixes"]]
          stale = sorted(ignores - matched)
          skipped = [d for d in report["dependencies"] if d.get("skip_reason")]

          lines = ["## pip-audit", ""]
          if findings:
              lines += [
                  "| Package | Version | Vulnerability | Fixed in | Suppressed |",
                  "|---|---|---|---|---|",
              ]
              for f in findings:
                  fixed = ", ".join(sorted(f["fixes"])) or "no fix"
                  mark = f"yes ({', '.join(f['hit'])})" if f["hit"] else "no"
                  lines.append(f"| {f['name']} | {f['version']} | {', '.join(sorted(f['ids']))} | {fixed} | {mark} |")
          else:
              lines.append("No known vulnerabilities found.")
          if skipped:
              lines += ["", "Not audited:"]
              lines += [f"- {d['name']}: {' '.join(d['skip_reason'].split())}" for d in skipped]
          lines += ["", f"Suppressions (PIP_AUDIT_IGNORES): {', '.join(sorted(ignores)) or 'none'}"]
          if stale:
              lines.append(f"Suppressions matching no finding (remove them): {', '.join(stale)}")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(summary)

          failed = False
          # pip-audit exits 1 when it finds vulnerabilities, but also when it
          # fails part-way; exit 1 with no findings is the latter, and any
          # status other than 0 or 1 is an error outright.
          status = os.environ["PIP_AUDIT_STATUS"]
          if status not in ("0", "1"):
              print(f"::error::pip-audit exited {status}")
              failed = True
          elif status == "1" and not findings:
              print("::error::pip-audit exited 1 but reported no vulnerabilities")
              failed = True
          for f in unsuppressed:
              print(f"::error::{f['name']} {f['version']}: {', '.join(sorted(f['ids']))} {f['desc'][:200]}")
              failed = True
          for f in fixable:
              level = "error" if scheduled else "warning"
              print(f"::{level}::Suppressed {', '.join(f['hit'])} in {f['name']} {f['version']} now has a fix ({', '.join(sorted(f['fixes']))}): upgrade and remove the suppression")
              failed |= scheduled
          for vuln_id in stale:
              level = "error" if scheduled else "warning"
              print(f"::{level}::Suppressed {vuln_id} no longer matches any finding: remove it from PIP_AUDIT_IGNORES")
              failed |= scheduled
          sys.exit(1 if failed else 0)
          EOF

  npm-audit:
    name: npm audit (JS SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit (high/critical, with documented allowlist)
        run: cd frontend && node scripts/audit-allowlist.mjs

  gitleaks:
    name: Gitleaks (Secret Scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config=auto --error --exclude="node_modules" --exclude=".venv" --exclude="uv.lock" --sarif --output=semgrep.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
