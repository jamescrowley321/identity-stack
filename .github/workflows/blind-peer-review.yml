# Blind Peer Review — fresh-context, diff-only AI PR review that fails the merge
# on real defects. https://github.com/jamescrowley321/blind-peer-review
#
# Setup:
#   1. Add repo secret OPENROUTER_API_KEY (an OpenRouter key with Anthropic access).
#   2. After the first run, require the "Merge Gate" check in branch protection.
#
# Toggle lenses in the ENABLED list in the `config` job — that one list drives
# BOTH the parallel review matrix AND the gate.
#
# The action is pinned to a commit SHA (v1.6.0) for OpenSSF Scorecard.

name: Blind Peer Review

# Security model: this is a `pull_request` (NOT pull_request_target) workflow, so
# it never runs with secrets for fork PRs — GitHub withholds all secrets and makes
# GITHUB_TOKEN read-only for forks. A forked PR that edits this file therefore
# cannot read OPENROUTER_API_KEY or forge a check run. Combined with the owner-only
# guard on `preflight` below, the secret-bearing lens jobs run only for the owner's
# own PRs; everyone else fails closed at the gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: blind-peer-review-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: only the `review` job (the lens reviewer that
# posts inline comments + per-lens check runs) is granted write, scoped on the
# job below. config/preflight/gate keep narrower read-only scopes.
permissions:
  contents: read

jobs:
  # The ONE place to toggle lenses. Emits the enabled set as a matrix (parallel
  # review jobs) and a CSV (the gate).
  config:
    runs-on: ubuntu-latest
    permissions: {} # computes the lens matrix only — no API access needed
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            cold_read   # logic bugs, footguns (zero context)
            edge_case   # unhandled branches / boundaries
            acceptance  # PR acceptance criteria met + tested
            security    # exploitable security vulnerabilities
            red_team    # red-team attack paths (auth/infra)
            policy      # AI-provenance policy + repo rules
            owasp_web   # OWASP Web Top 10 — this is a web app + API
            # owasp_llm # OWASP GenAI/LLM Top 10 — enable if/when LLM features land
        run: |
          const NAMES = {
            cold_read: "Cold Read", "edge_case": "Edge Cases",
            acceptance: "Acceptance Criteria", security: "Security Review", red_team: "Red Team",
            policy: "Policy & Provenance", "owasp_web": "OWASP Web Top 10",
            "owasp_llm": "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) {
            // `shell: node {0}` runs plain Node — there is no actions/github-script
            // `core` object here, so fail via process.exit, not `core.setFailed`.
            console.error("ENABLED must list at least one lens; an empty matrix would fail workflow validation with an opaque error.");
            process.exit(1);
          }
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);

  # Don't spend the paid lenses until the cheap deterministic gates pass. Runs
  # only for owner-authored PRs (guard below); forks, collaborators, and bots
  # (e.g. Dependabot) skip the paid lenses and fail closed at the gate.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Auto-review runs ONLY for PRs authored by the repo owner. Collaborators,
    # outside contributors, forks, and bots skip the paid lenses; the gate then
    # fails closed (below), so those PRs require manual owner review + merge.
    if: github.event.pull_request.author_association == 'OWNER'
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # EXACT check-run names (job `name:` values) that must pass first.
          required_checks: |
            Lint
            Unit Tests
            Semgrep (SAST)
            Gitleaks (Secret Scanning)

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # The only job that needs write: it posts inline review comments and the
    # per-lens check run. Scoped here rather than granted workflow-wide.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: read # the Compliance lens reads the PR thread
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # This is an auth/security app — use the sanctioned quality model for the
          # security-sensitive lenses. Overridable per repo.
          model: anthropic/claude-sonnet-5
          # Enforce OpenRouter routing guardrails on the request (ZDR, price-sort
          # inside filters) — not just at the account level.
          models_config: |
            {
              "providers": {
                "openrouter": {
                  "modelOverrides": {
                    "anthropic/claude-sonnet-5": {
                      "compat": { "openRouterRouting": { "sort": "price", "zdr": true } }
                    }
                  }
                }
              }
            }

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run so the required "Merge Gate" check is never absent or skipped.
    # Branch protection treats a skipped required check as passing, so a gate
    # that skips for non-owner PRs (whose review is skipped) would let them merge
    # with zero review. Fail closed instead — non-owner PRs require manual review.
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      # review is 'skipped' for non-owner PRs (only owner PRs are auto-reviewed)
      # and 'failure' if a lens leg crashed. Either way, don't adjudicate a
      # partial/absent lens set — fail closed so the owner reviews and merges.
      - name: Fail closed when review did not complete
        if: needs.review.result != 'success'
        run: |
          echo "::error::Adversarial review did not complete (non-owner PR, or a lens failed: review=${{ needs.review.result }}). Only owner PRs are auto-reviewed; others require manual owner review + merge. The Merge Gate fails closed."
          exit 1
      - name: Adjudicate lenses
        if: needs.review.result == 'success'
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.matrix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
