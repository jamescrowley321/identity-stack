# Adversarial Review — fresh-context, diff-only AI PR review. ON DEMAND ONLY.
# https://github.com/jamescrowley321/blind-peer-review (renamed; this pin is the
# pre-rename v1.6.0 SHA, which GitHub still resolves through the redirect).
#
# This does NOT run automatically on pull requests, and "Merge Gate" is NOT a
# required check. Routine review happens locally, before the push, running the
# same lens library as isolated Claude Code subagents:
#
#     /plugin marketplace add jamescrowley321/blind-peer-review
#     /plugin install blind-peer-review
#     /blind-peer-review:check     # reviews the working diff against origin/main
#
# This workflow stays for the times a cloud second opinion is wanted on an open
# PR: run it from the Actions tab with the PR number.
#
# Why it is not automatic: the action posts a GitHub review per lens on every
# run, and a lens with zero findings still posts one — it anchors a synthetic
# "See the review summary." inline comment on the first changed line. There is
# no input that suppresses posting, so six lenses times every push put review
# comments on every PR regardless of whether anything was found. Nothing gated
# on them: "Merge Gate" was never added to branch protection in this repo.
#
# Setup: repo secret OPENROUTER_API_KEY. Toggle lenses in the ENABLED list in the
# `config` job — that one list drives BOTH the review matrix AND the gate.

name: Adversarial Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the open PR to review'
        required: true
        type: string

# Keyed on the PR, not github.ref: a dispatch always runs on a branch ref (main,
# normally), so keying on the ref would make two reviews of two different PRs
# cancel each other.
concurrency:
  group: adversarial-review-${{ inputs.pr_number }}
  cancel-in-progress: true
# Least privilege by default: only the `review` job (the lens reviewer that
# posts inline comments + per-lens check runs) is granted write, scoped on the
# job below. config/preflight/gate keep narrower read-only scopes.
permissions:
  contents: read

jobs:
  # The ONE place to toggle lenses. Emits the enabled set as a matrix (parallel
  # review jobs) and a CSV (the gate).
  config:
    runs-on: ubuntu-latest
    permissions: {} # computes the lens matrix only — no API access needed
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      csv: ${{ steps.pick.outputs.csv }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            blind          # logic bugs, footguns (zero context)
            edge-case      # unhandled branches / boundaries
            acceptance     # PR acceptance criteria met + tested
            sentinel       # exploitable security vulnerabilities
            viper          # red-team attack paths (auth/infra)
            compliance     # AI-provenance policy + repo rules
            owasp-web      # OWASP Web Top 10 — this is a web app + API
            # owasp-llm    # OWASP GenAI/LLM Top 10 — enable if/when LLM features land
        run: |
          const NAMES = {
            blind: "Blind Hunter", "edge-case": "Edge Case Hunter",
            acceptance: "Acceptance Auditor", sentinel: "Sentinel", viper: "Viper",
            compliance: "Compliance Auditor", "owasp-web": "OWASP Web Top 10",
            "owasp-llm": "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) {
            // `shell: node {0}` runs plain Node — there is no actions/github-script
            // `core` object here, so fail via process.exit, not `core.setFailed`.
            console.error("ENABLED must list at least one lens; an empty matrix would fail workflow validation with an opaque error.");
            process.exit(1);
          }
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `csv=${keys.join(",")}\n`);

  # Don't spend the paid lenses until the cheap deterministic gates pass.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No owner/fork guard is needed any more: workflow_dispatch requires write
    # access on this repo, so a fork, an outside contributor or a bot cannot
    # start this workflow at all. The old guard read
    # github.event.pull_request.author_association, which is empty on a dispatch
    # — it would evaluate false and skip every lens.
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/adversarial-review@7d18b99faf7567366b5091deaf1470692d668245 # v1.6.0
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          # EXACT check-run names (job `name:` values) that must pass first.
          required_checks: "Lint, Unit Tests, Semgrep (SAST), Gitleaks (Secret Scanning)"

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # The only job that needs write: it posts inline review comments and the
    # per-lens check run. Scoped here rather than granted workflow-wide.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: read # the Compliance lens reads the PR thread
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/adversarial-review@7d18b99faf7567366b5091deaf1470692d668245 # v1.6.0
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # This is an auth/security app — use the sanctioned quality model for the
          # security-sensitive lenses. Overridable per repo.
          model: anthropic/claude-sonnet-5
          # Enforce OpenRouter routing guardrails on the request (ZDR, price-sort
          # inside filters) — not just at the account level.
          models_config: |
            {
              "providers": {
                "openrouter": {
                  "modelOverrides": {
                    "anthropic/claude-sonnet-5": {
                      "compat": { "openRouterRouting": { "sort": "price", "zdr": true } }
                    }
                  }
                }
              }
            }

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run, so a dispatch whose lenses were skipped or crashed reports an
    # explicit failure rather than quietly vanishing from the run summary.
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      # review is 'skipped' if preflight failed and 'failure' if a lens leg
      # crashed. Either way, don't adjudicate a partial/absent lens set.
      - name: Fail closed when review did not complete
        if: needs.review.result != 'success'
        run: |
          echo "::error::Adversarial review did not complete (review=${{ needs.review.result }}): preflight failed, or one or more lenses crashed. Nothing was adjudicated — re-run the dispatch, or review locally with /blind-peer-review:check."
          exit 1
      - name: Adjudicate lenses
        if: needs.review.result == 'success'
        uses: jamescrowley321/adversarial-review@7d18b99faf7567366b5091deaf1470692d668245 # v1.6.0
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.csv }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
