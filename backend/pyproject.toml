[project]
name = "identity-stack-backend"
version = "0.1.0"
description = "FastAPI backend for Identity Stack"
requires-python = ">=3.12"
dependencies = [
    # Capped <0.137: FastAPI 0.137 changed include_router to append a lazy
    # `_IncludedRouter` proxy to app.routes instead of flattening child routes.
    # slowapi 0.1.10's SlowAPIMiddleware route matcher only recognizes top-level
    # routes with an `.endpoint`, so router-included routes become "unmatched" and
    # SlowAPIMiddleware silently exempts them — disabling default rate limits.
    # Revisit when slowapi ships a fix for the new inclusion model.
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.34.0,<1",
    # Floor at 3.8.5: first release that requires cryptography>=50, which carries
    # the fixes for PYSEC-2026-3552/3553/3554. Older py-identity-model caps
    # cryptography<49 and would hold us on a vulnerable build.
    "py-identity-model>=3.8.5,<4",
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.14",
    "expression>=5.0",
    "httpx>=0.28,<1",
    "pydantic[email]>=2.12.5",
    "slowapi>=0.1.9,<1",
    "python-json-logger>=4.1.0,<5",
    "scalar-fastapi>=1.8.2",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.62b0",
    "opentelemetry-instrumentation-logging>=0.62b0",
    "redis[hiredis]>=7.4.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "anyio[trio]>=4.13.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# TID251 enforces the house rules in docs/conventions.md; G004/G010 keep log calls lazy.
select = ["E", "F", "I", "W", "S", "TID251", "G004", "G010"]

# docs/conventions.md §1, §4 and §7. Each helper module is the one exception to
# its own ban and is listed under per-file-ignores below.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through app.knobs (docs/conventions.md §1)."
"os.getenv".msg = "Read configuration through app.knobs (docs/conventions.md §1)."
"httpx".msg = "Build clients with app.outbound.outbound_client and catch its Upstream* errors (docs/conventions.md §4)."
"logging.getLogger".msg = "Get a logger with app.logbook.logbook(__name__) (docs/conventions.md §7)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "TID251"]  # assert, hardcoded passwords OK in tests; house bans cover app/ only
"app/knobs.py" = ["TID251"]  # the settings module: the one reader of os.environ
"app/outbound.py" = ["TID251"]  # the HTTP client helper: the one importer of httpx
"app/logbook.py" = ["TID251"]  # the logging helper: the one caller of logging.getLogger
"scripts/**" = ["TID251"]  # operator scripts run outside the app process
"migrations/**" = ["TID251"]  # Alembic env.py runs under the alembic CLI and reads DATABASE_URL itself

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "anyio: mark test to run with anyio",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest-playwright>=0.7.2",
    "pytest>=9.0.3",
    "anyio[trio]>=4.13.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.0",
]
