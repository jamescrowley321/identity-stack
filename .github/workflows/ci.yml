name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - name: Ruff check
        run: cd backend && ruff check .

      - name: Ruff format check
        run: cd backend && ruff format --check .

      - name: Import contracts
        run: cd backend && lint-imports

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests
        run: cd frontend && npm test

      - name: TypeScript type check
        run: cd frontend && npx tsc -b

      - name: ESLint
        run: cd frontend && npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - name: Start test stack (postgres + redis + hydra)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run unit tests
        run: cd backend && python -m pytest tests/unit/ -v
        env:
          DESCOPE_PROJECT_ID: "test-project-id"
          TEST_DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          TEST_REDIS_URL: redis://localhost:16379/0

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Dependabot excluded deliberately. GitHub serves `pull_request` events raised
    # by Dependabot from a separate secret store, so `secrets.DESCOPE_*` are empty
    # on those runs — and since the credential gates in tests/e2e/conftest.py and
    # tests/integration/conftest.py now FAIL rather than skip when a credential is
    # missing, every Dependabot PR would fail these two jobs for a reason that says
    # nothing about the dependency. Dependabot's branches live in this repo, so the
    # `head.repo.full_name` check above does not exclude them.
    #
    # The trade-off, stated rather than hidden: a skipped job satisfies branch
    # protection, so a Dependabot bump is not covered by the credentialed suites.
    # That was already true — those tests skipped internally and the job went green
    # anyway — but it is now visible as a skipped job instead of a green one. The
    # durable fix is to populate the same values as *Dependabot* secrets
    # (Settings → Secrets → Dependabot), after which this exclusion can be dropped.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository
       && github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - name: Start test stack (postgres + redis + hydra + keycloak)
        # The Keycloak issuer is a fixed *.localhost name; pin it to loopback
        # rather than depend on the runner's resolver.
        run: |
          echo "127.0.0.1 keycloak-test.localhost" | sudo tee -a /etc/hosts
          docker compose -f docker-compose.test.yml --profile keycloak up -d --wait

      - name: Run integration tests
        # Deliberately unguarded. A step-level `if:` on a credential meant that an
        # empty secret skipped the step and the job still reported green with
        # nothing exercised. The credential check now lives in
        # tests/integration/conftest.py, which fails rather than skips when CI is
        # set — so a missing secret turns this job red instead of hollow.
        #
        # No ORY_* secrets here on purpose: the Ory end-to-end suite mints real
        # tokens from the hydra-test container brought up above, so it runs on
        # every PR with no credential at all. Setting the ORY_TEST_* group (see
        # backend/.env.example) points the same tests at a live Ory project.
        run: cd backend && python -m pytest tests/integration/ -v
        env:
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          DESCOPE_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}
          DESCOPE_EXPIRED_TOKEN: ${{ secrets.DESCOPE_EXPIRED_TOKEN }}
          TEST_DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          TEST_REDIS_URL: redis://localhost:16379/0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Run the Keycloak integration tests against a realm built by infra/keycloak
        # The same tests again, logged in to the realm the Terraform root builds
        # beside the import (generated user ids, passwords and directory secret)
        # instead of the import. Here rather than in the credential-free
        # keycloak-terraform-check job: one of them needs a live Descope token.
        run: make keycloak-terraform-integration
        env:
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          DESCOPE_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml --profile keycloak down -v

  keycloak-terraform-check:
    name: Keycloak Terraform Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No credential: the realm is built in the keycloak-test container, so this
    # runs on every pull request, forks and Dependabot included. It fails when
    # infra/keycloak and keycloak/realm/identity-stack-realm.json disagree.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Start keycloak-test
        # The Keycloak issuer is a fixed *.localhost name; pin it to loopback
        # rather than depend on the runner's resolver.
        run: |
          echo "127.0.0.1 keycloak-test.localhost" | sudo tee -a /etc/hosts
          make test-up-keycloak

      - name: Apply infra/keycloak and compare it with the imported realm
        run: make keycloak-terraform-check

  zitadel-terraform-check:
    name: Zitadel Terraform Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No credential: infra/zitadel is applied to a fresh compose Zitadel, with the
    # token its first start writes to a volume, so this runs on every pull request.
    # The backend's live Zitadel suite (tests/integration_zitadel) then runs against
    # the applied root, with the test Postgres.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Start the local Zitadel
        # The issuer is a fixed *.localhost name; pin it to loopback rather than
        # depend on the runner's resolver.
        run: |
          echo "127.0.0.1 zitadel.localhost" | sudo tee -a /etc/hosts
          make zitadel-up

      - name: Start the test Postgres
        run: make test-up

      - name: Apply infra/zitadel, read the instance back and run the live Zitadel suite
        run: make zitadel-terraform-integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Dependabot excluded deliberately. GitHub serves `pull_request` events raised
    # by Dependabot from a separate secret store, so `secrets.DESCOPE_*` are empty
    # on those runs — and since the credential gates in tests/e2e/conftest.py and
    # tests/integration/conftest.py now FAIL rather than skip when a credential is
    # missing, every Dependabot PR would fail these two jobs for a reason that says
    # nothing about the dependency. Dependabot's branches live in this repo, so the
    # `head.repo.full_name` check above does not exclude them.
    #
    # The trade-off, stated rather than hidden: a skipped job satisfies branch
    # protection, so a Dependabot bump is not covered by the credentialed suites.
    # That was already true — those tests skipped internally and the job went green
    # anyway — but it is now visible as a skipped job instead of a green one. The
    # durable fix is to populate the same values as *Dependabot* secrets
    # (Settings → Secrets → Dependabot), after which this exclusion can be dropped.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository
       && github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/setup-backend

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}

      - name: Start test stack (postgres + redis + hydra)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Apply database schema
        run: cd backend && python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test

      # JIT provisioning resolves the caller's provider through the canonical
      # `providers` registry, so an Ory principal cannot be provisioned until the
      # row exists. Seeded with the shipped script, the same way a real deployment
      # does it — a test-only INSERT here would leave scripts/seed_ory.py
      # unexercised and let it rot.
      - name: Register the Ory provider
        run: cd backend && python -m scripts.seed_ory
        env:
          DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          ORY_ISSUER_URL: http://127.0.0.1:14444

      # The backend must run against a schema-bearing database. It previously ran
      # on sqlite :memory:, which passes the startup connectivity check but has no
      # tables, so every canonical-repository route raised "no such table".
      # Redirected to a file, not left on the step's stdout. The backend outlives
      # the step that starts it, so everything it logs during the test run —
      # including the upstream Descope status and body behind every 400/502 the
      # API passes through — was written to an already-closed step log and lost.
      # That is what made this failure class undiagnosable from CI alone.
      # The identity-resolution endpoint authenticates with a shared secret read
      # from the environment at import time. Unset, the backend rejected every
      # request and the suite could only ever observe the 422 FastAPI raises for
      # the missing header — so the unknown-provider test could never reach the
      # 404 it asserts. Generated per run rather than committed: it is a
      # localhost-only test credential and nothing should ship a fixed one.
      #
      # The webhook and flow-sync endpoints authenticate the same way, from
      # DESCOPE_WEBHOOK_SECRET and DESCOPE_FLOW_SYNC_SECRET. Unset, they reject
      # every request and the four tests covering them — including the only
      # coverage of webhook HMAC verification — skipped on every run. The tests
      # compute the HMAC from the same variable, so generating one here is
      # enough to exercise the real signature path.
      #
      # add-mask so a generated value cannot surface in a step log: these are
      # written to $GITHUB_ENV, which GitHub does not mask on its own.
      - name: Generate the test stack's shared secrets
        run: |
          for name in INTERNAL_IDENTITY_KEY DESCOPE_WEBHOOK_SECRET DESCOPE_FLOW_SYNC_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start backend
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          sleep 3
        env:
          INTERNAL_IDENTITY_KEY: ${{ env.INTERNAL_IDENTITY_KEY }}
          DESCOPE_WEBHOOK_SECRET: ${{ env.DESCOPE_WEBHOOK_SECRET }}
          DESCOPE_FLOW_SYNC_SECRET: ${{ env.DESCOPE_FLOW_SYNC_SECRET }}
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
          DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
          REDIS_URL: redis://localhost:16379/0
          # Ory as a *configured* provider, alongside Descope rather than instead
          # of it — which is the property tests/e2e/test_ory_sso_e2e.py exists to
          # hold. The issuer is the hydra-test container from the test stack; no
          # trailing slash, because the middleware's allow-list check is exact
          # string equality against the token's `iss`.
          ORY_ISSUER_URL: http://127.0.0.1:14444
          ORY_AUDIENCE: identity-stack-api
          # The rate-limit key is the authenticated `sub`, and the whole E2E suite
          # shares one access-key identity — so the default 10/minute write budget
          # is consumed by the first few tests and the rest 429. That is an artifact
          # of the harness, not of real usage. Limiter behavior is covered by the 18
          # tests in tests/unit/test_rate_limiting.py.
          RATE_LIMIT_DEFAULT: 2000/minute
          RATE_LIMIT_AUTH: 1000/minute

      - name: Start frontend (preview)
        run: |
          cd frontend
          npx vite preview --port 3000 &
          sleep 2

      - name: Run E2E tests
        # Deliberately unguarded, as above: the `_credentials_are_present_in_ci`
        # fixture in tests/e2e/conftest.py fails the run when a secret is missing,
        # and a skipped step would mean that gate never executes at all.
        # Screenshots + traces on failure, for the same reason the backend log is
        # kept: a Playwright assertion failure reports only which locator it
        # waited for, never what the page actually showed, so a UI failure is
        # undiagnosable from CI alone.
        run: >-
          cd backend && python -m pytest tests/e2e/ -v
          --screenshot=only-on-failure
          --tracing=retain-on-failure
          --output="$RUNNER_TEMP/playwright"
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/playwright
          INTERNAL_IDENTITY_KEY: ${{ env.INTERNAL_IDENTITY_KEY }}
          DESCOPE_WEBHOOK_SECRET: ${{ env.DESCOPE_WEBHOOK_SECRET }}
          DESCOPE_FLOW_SYNC_SECRET: ${{ env.DESCOPE_FLOW_SYNC_SECRET }}
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
          DESCOPE_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          DESCOPE_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_TENANT_ID: ${{ secrets.E2E_TEST_TENANT_ID }}
          E2E_FRONTEND_URL: "http://localhost:3000"
          E2E_BACKEND_URL: "http://localhost:8000"
          # Must match ORY_ISSUER_URL above: the suite fails fast rather than
          # emitting tokens the backend was never going to accept.
          E2E_ORY_ISSUER_URL: http://127.0.0.1:14444
          # Granting a canonical role has no API an Ory principal can reach
          # (POST /api/roles/assign depends on the Descope `dct` claim), so the
          # tier-3 authorization test writes the grant directly.
          E2E_DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test

      # This repository is public, so its artifacts are world-readable. The
      # backend is not supposed to log credentials, but an unhandled traceback
      # can carry one it was handed, so the log is scrubbed before it ever leaves
      # the runner rather than trusted to be clean: JWT-shaped triples and any
      # Bearer value are redacted. Never weaken this to upload the raw log.
      #
      # The management-key rule is word-anchored. Unanchored, its K matched inside
      # any longer alphanumeric token, so Descope user and tenant ids carrying a K
      # with 25+ characters behind it were rewritten to <redacted-key> — 152 times
      # across the published artifacts. That errs safe, but it blanks exactly the
      # identity detail these logs exist to show.
      - name: Redact credentials from the backend log
        id: redact
        if: always()
        run: |
          f="$RUNNER_TEMP/backend.log"
          [ -f "$f" ] || exit 0
          sed -i -E \
            -e 's/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
            -e 's/(bearer )[A-Za-z0-9._~+:\/-]+=*/\1<redacted>/gI' \
            -e 's/(basic )[A-Za-z0-9+\/=]+/\1<redacted>/gI' \
            -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^:/@ ]+:[^@ ]+@#\1<redacted>:<redacted>@#g' \
            -e 's/\bK[A-Za-z0-9_-]{25,}/<redacted-key>/g' \
            -e 's/\b[0-9a-f]{64}\b/<redacted-hex>/g' \
            "$f"

      # Always, not only on failure: a suite that passes while the backend logs
      # upstream errors is exactly the state this repo spent months in.
      # NOT plain always(): publishing is conditional on the redaction above
      # having succeeded. If sed fails the log must not leave the runner —
      # this repository is public and artifacts are world-readable.
      - name: Upload backend log
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: warn
          retention-days: 7

      # The same treatment as the backend log, for the same reason: conftest
      # writes page.content(), the page URL and console output into this
      # directory from a session authenticated as owner+admin, and this
      # repository is public. Text is scrubbed with the rules above; the upload
      # is gated on the scrub succeeding. Screenshots and traces are binary and
      # cannot be scrubbed line-wise — they still carry whatever the
      # authenticated UI rendered, which is why retention is short.
      - name: Redact credentials from the Playwright artifacts
        id: redact_playwright
        if: always()
        run: |
          d="$RUNNER_TEMP/playwright"
          [ -d "$d" ] || exit 0
          find "$d" -type f \( -name '*.html' -o -name '*.txt' -o -name '*.json' -o -name '*.md' \) -print0 \
            | xargs -0 --no-run-if-empty sed -i -E \
              -e 's/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
              -e 's/(bearer )[A-Za-z0-9._~+:\/-]+=*/\1<redacted>/gI' \
              -e 's/(basic )[A-Za-z0-9+\/=]+/\1<redacted>/gI' \
              -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^:/@ ]+:[^@ ]+@#\1<redacted>:<redacted>@#g' \
              -e 's/\bK[A-Za-z0-9_-]{25,}/<redacted-key>/g' \
              -e 's/\b[0-9a-f]{64}\b/<redacted-hex>/g'

      - name: Upload Playwright failure artifacts
        if: always() && steps.redact_playwright.outcome == 'success' 
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-playwright-failures
          path: ${{ runner.temp }}/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e-keycloak:
    name: E2E Tests (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No credential: the realm is the keycloak-test import, so this runs on
    # every pull request, forks and Dependabot included. The Descope E2E job
    # above needs secrets and serves its own SPA on localhost:3000, the only
    # origin the realm's app clients redirect to, so the Keycloak suite has a
    # job of its own (backend/tests/e2e_keycloak/).
    env:
      DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
      KEYCLOAK_ISSUER_URL: http://keycloak-test.localhost:18180/realms/identity-stack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/setup-backend

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend for the realm's member-app
        run: cd frontend && npm run build
        env:
          VITE_OIDC_AUTHORITY: ${{ env.KEYCLOAK_ISSUER_URL }}
          VITE_OIDC_CLIENT_ID: member-app
          VITE_OIDC_SCOPE: "openid profile email organization:acme"
          VITE_OIDC_TENANT_SCOPE_TEMPLATE: "openid profile email organization:{tenant}"

      - name: Start test stack (postgres + redis + hydra + keycloak)
        # The Keycloak issuer is a fixed *.localhost name; pin it to loopback
        # rather than depend on the runner's resolver.
        run: |
          echo "127.0.0.1 keycloak-test.localhost" | sudo tee -a /etc/hosts
          make test-up-keycloak

      - name: Apply database schema
        run: cd backend && python -m alembic upgrade head

      - name: Register the Keycloak provider
        run: cd backend && python -m scripts.seed_keycloak

      - name: Start backend
        # Configured for the realm as docs/local-development.md says. Descope is
        # left unconfigured: these tests present Keycloak tokens only. The log
        # goes to a file: the backend outlives this step.
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8000/api/health
        env:
          DESCOPE_PROJECT_ID: ""
          DESCOPE_MANAGEMENT_KEY: ""
          REDIS_URL: redis://localhost:16379/0
          KEYCLOAK_AUDIENCES: member,tenant-admin
          KEYCLOAK_APP_CLIENTS: member=member-app,tenant-admin=tenant-admin-app
          KEYCLOAK_PORTABLE_TYPES: member
          KEYCLOAK_ORGANIZATION_BOUND_TYPES: tenant-admin
          KEYCLOAK_PORTABLE_PERMISSIONS: member=documents:read
          KEYCLOAK_REQUIRE_HTTPS: "false"
          KEYCLOAK_DIRECTORY_CLIENT_ID: identity-stack-directory
          # Local fixture value from keycloak/realm/identity-stack-realm.json.
          KEYCLOAK_DIRECTORY_CLIENT_SECRET: local-only-directory-client
          JIT_ENABLED_PROVIDERS: keycloak
          # The limiter runs before token validation, so its key is the client
          # address, shared by every request in this job. At the 60/minute
          # default, the every-protected-route refusal test would get 429s
          # instead of 401s. Limiter behaviour is covered by
          # tests/unit/test_rate_limiting.py.
          RATE_LIMIT_DEFAULT: 2000/minute
          RATE_LIMIT_AUTH: 1000/minute

      - name: Start frontend (preview)
        run: |
          cd frontend
          npx vite preview --port 3000 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:3000/login

      - name: Run Keycloak E2E tests
        # The suite's session fixture fails every test, never skips, when
        # keycloak-test, the backend or the SPA does not answer.
        run: >-
          cd backend && python -m pytest tests/e2e_keycloak/ -v
          --screenshot=only-on-failure
          --tracing=retain-on-failure
          --output="$RUNNER_TEMP/playwright"
        env:
          E2E_BACKEND_URL: "http://localhost:8000"

      # Same scrub as the Descope E2E job before anything leaves the runner:
      # this repository is public and artifacts are world-readable.
      - name: Redact credentials from the logs
        id: redact
        if: always()
        run: |
          for f in "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log"; do
            [ -f "$f" ] || continue
            sed -i -E \
              -e 's/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
              -e 's/(bearer )[A-Za-z0-9._~+:\/-]+=*/\1<redacted>/gI' \
              -e 's/(basic )[A-Za-z0-9+\/=]+/\1<redacted>/gI' \
              -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^:/@ ]+:[^@ ]+@#\1<redacted>:<redacted>@#g' \
              "$f"
          done

      - name: Upload logs
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-keycloak-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: warn
          retention-days: 7

      # Screenshots and traces hold only the fixture realm's throwaway users,
      # but traces carry their tokens, so retention is short.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-keycloak-playwright-failures
          path: ${{ runner.temp }}/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: make test-down

  e2e-zitadel:
    name: E2E Tests (Zitadel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    # No credential: infra/zitadel is applied to a fresh compose Zitadel with the
    # token its first start writes to a volume, so this runs on every pull
    # request, forks and Dependabot included. The SPA is served on
    # localhost:3000, the origin the root's applications redirect to, so the
    # suite has a job of its own (backend/tests/e2e_zitadel/).
    env:
      DATABASE_URL: postgresql+asyncpg://identity_test:identity_test@localhost:15432/identity_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/setup-backend

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Start the local Zitadel and the test Postgres
        # The issuer is a fixed *.localhost name; pin it to loopback rather than
        # depend on the runner's resolver.
        run: |
          echo "127.0.0.1 zitadel.localhost" | sudo tee -a /etc/hosts
          make zitadel-up
          make test-up

      - name: Apply infra/zitadel
        # Local state in infra/zitadel, which the later steps read the outputs from.
        # Assigned, then exported: `export X="$(...)"` returns export's status, not make's.
        run: |
          TF_VAR_zitadel_access_token="$(make -s zitadel-admin-pat)"
          export TF_VAR_zitadel_access_token
          terraform -chdir=infra/zitadel init -input=false
          terraform -chdir=infra/zitadel apply -auto-approve -input=false -var-file=environments/dev.tfvars

      - name: Apply database schema and link the tenants
        run: |
          (cd backend && python -m alembic upgrade head)
          make zitadel-seed

      - name: Build frontend for the SPA application
        # The root's frontend_environment, with no tenant scope template: a
        # Zitadel user switches tenant on the client.
        run: |
          # Captured first: `eval "$(...)"` would drop a terraform or jq failure.
          set -o pipefail
          vars="$(terraform -chdir=infra/zitadel output -json frontend_environment \
            | jq -er 'to_entries[] | if (.key | test("^VITE_OIDC_[A-Z_]+$")) then "export \(.key)=\(.value | @sh)" else error("unexpected key \(.key)") end')"
          eval "$vars"
          cd frontend && VITE_OIDC_TENANT_SCOPE_TEMPLATE= npm run build

      - name: Start backend
        # The root's backend_environment, with canonical authorization and first
        # login for zitadel. Descope is left unconfigured: these tests present
        # Zitadel tokens only. The log goes to a file: the backend outlives this step.
        run: |
          # Captured first: `eval "$(...)"` would drop a terraform or jq failure.
          set -o pipefail
          vars="$(terraform -chdir=infra/zitadel output -json backend_environment \
            | jq -er 'to_entries[] | if (.key | test("^ZITADEL_[A-Z_]+$")) then "export \(.key)=\(.value | @sh)" else error("unexpected key \(.key)") end')"
          eval "$vars"
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8000/api/health
        env:
          DESCOPE_PROJECT_ID: ""
          DESCOPE_MANAGEMENT_KEY: ""
          REDIS_URL: redis://localhost:16379/0
          CANONICAL_RBAC_PROVIDERS: zitadel
          JIT_ENABLED_PROVIDERS: zitadel
          FRONTEND_URL: http://localhost:3000
          # The limiter runs before token validation, so its key is the client
          # address, shared by every request in this job. Limiter behaviour is
          # covered by tests/unit/test_rate_limiting.py.
          RATE_LIMIT_DEFAULT: 2000/minute
          RATE_LIMIT_AUTH: 1000/minute

      - name: Start frontend (preview)
        run: |
          cd frontend
          npx vite preview --port 3000 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:3000/login

      - name: Run Zitadel E2E tests
        # The suite's session fixtures fail every test, never skip, when
        # Zitadel, the database, the backend or the SPA does not answer.
        run: >-
          make test-e2e-zitadel
          PYTEST_ARGS='--screenshot=only-on-failure --tracing=retain-on-failure --output=${{ runner.temp }}/playwright'
        env:
          E2E_BACKEND_URL: "http://localhost:8000"
          E2E_FRONTEND_URL: "http://localhost:3000"

      # Same scrub as the other E2E jobs before anything leaves the runner: this
      # repository is public and artifacts are world-readable.
      - name: Redact credentials from the logs
        id: redact
        if: always()
        run: |
          for f in "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log"; do
            [ -f "$f" ] || continue
            sed -i -E \
              -e 's/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
              -e 's/(bearer )[A-Za-z0-9._~+:\/-]+=*/\1<redacted>/gI' \
              -e 's/(basic )[A-Za-z0-9+\/=]+/\1<redacted>/gI' \
              -e 's#([a-zA-Z][a-zA-Z0-9+.-]*://)[^:/@ ]+:[^@ ]+@#\1<redacted>:<redacted>@#g' \
              "$f"
          done

      - name: Upload logs
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-zitadel-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: warn
          retention-days: 7

      # Screenshots and traces hold only the instance's throwaway test users, but
      # traces carry their tokens and passwords, so retention is short.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-zitadel-playwright-failures
          path: ${{ runner.temp }}/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stacks
        if: always()
        run: |
          make test-down
          POSTGRES_PASSWORD=unused DESCOPE_PROJECT_ID=unused TYK_GATEWAY_SECRET=unused \
            docker compose --profile zitadel down --volumes zitadel-proxy zitadel-login zitadel-api zitadel-db

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker images
        run: docker compose build
        env:
          DESCOPE_PROJECT_ID: "test-project-id"
          POSTGRES_PASSWORD: "ci-build-only"
          TYK_GATEWAY_SECRET: "ci-build-only"

  profile-integration-tests:
    name: Profile Integration Tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-integration
      DESCOPE_PROJECT_ID: ci-test-project
      DESCOPE_MANAGEMENT_KEY: ci-integration-mgmt-key
      TYK_GATEWAY_SECRET: ci-integration-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run standalone profile integration tests
        run: make test-integration-standalone

      - name: Run gateway profile integration tests
        run: make test-integration-gateway
